<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>IEGH DocuHub</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101827;
      color: #eef4ff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5%;
    }

    main {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 3.5rem);
      margin-bottom: 10px;
    }

    .subtitle {
      color: #9bb7dc;
      font-size: clamp(1rem, 3vw, 1.2rem);
    }

    .panel {
      margin-top: 30px;
      padding: 6%;
      background: #1c2a40;
      border: 1px solid #354b69;
      border-radius: 16px;
    }

    .status {
      color: #83e5b1;
      font-weight: bold;
    }

    .button {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      background: #3966a5;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      border: 0;
    }

    .button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <main>
    <h1>IEGH DocuHub</h1>
    <p class="subtitle">
      Investigation Documentation & Evidence Hub
    </p>

    <section class="panel">
      <p class="status">System Interface Online</p>
      <p>
        Welcome to the IEGH investigation
        documentation system.
      </p>
      <button class="button" disabled>
        Investigator Login - Coming Soon
      </button>
    </section>
  </main>
</body>
</html>
